<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover обязателен: без него телефон не пускает страницу под
         вырез и под полосу жеста, а те области красит сам — отсюда и бралось
         деление экрана на серое и чёрное. Он же включает env(safe-area-inset-*),
         на которые расставлен интерфейс: без cover они все нули. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Чем браузер красит свои полосы вокруг страницы. Не скажешь — возьмёт
         свой цвет, и на чёрной игре он читается как серая плашка. -->
    <meta name="theme-color" content="#07090a" />

    <!-- То же самое для запуска с домашнего экрана: строка состояния поверх
         игры, а не отдельной светлой полосой. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Through The Dead City</title>
    <style>
      /* Чёрный в игре один и тот же — тот же, что у ворот, экрана загрузки и
         тумана. Раньше страница была на тон светлее слоёв поверх неё, и там,
         где слой не доходил до края (полоса под адресной строкой телефона,
         оттяжка страницы), проступала светлая линия. */
      /* Тёмная схема объявлена явно. Иначе подложка страницы у браузера белая,
         и всё, что не закрыто нашим слоем, — полоса под адресной строкой,
         оттяжка, область выреза — светится серым поверх чёрной игры. */
      :root { color-scheme: dark; background: #07090a; }

      /* Высота в динамических единицах: на телефоне адресная строка то
         прячется, то возвращается, и `100%` отмеряется по одному её состоянию,
         оставляя полосу в другом. `100%` оставлен запасным для старых браузеров. */
      html, body {
        margin: 0; height: 100%; height: 100dvh;
        overflow: hidden; background: #07090a;
        touch-action: none; -webkit-user-select: none; user-select: none;
        overscroll-behavior: none;
        /* Страница прибита к экрану и ехать ей некуда: ни оттяжки, ни отскока,
           ни сдвига после щипка. Без этого растянутая страница уезжала вбок, а
           холст оставался на месте — экран делился на две несходящиеся половины. */
        position: fixed; inset: 0; width: 100%;
        /* Телефон иначе сам подгоняет кегль под ширину, когда страница
           растянута, и подписи разъезжаются. */
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
        /* Долгое нажатие не должно звать меню «скопировать картинку»: игрок
           держит палец на стике секундами. */
        -webkit-touch-callout: none;
      }
      #app { position: fixed; inset: 0; }
      /* Текст вступления: внизу по центру, над джойстиком. Тёмная подложка —
         иначе светлые буквы теряются на светлой земле. */
      .radiotext {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: calc(92px + env(safe-area-inset-bottom));
        z-index: 45; pointer-events: none;
        width: min(80vw, 720px);
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .radiotext--on { opacity: 1; }

      .radiotext__line {
        margin: 0; padding: 10px 16px;
        border-radius: 10px;
        background: rgba(7, 9, 10, 0.55);
        /* Тени у букв нет: под ними своя подложка, и она уже отделяет текст от
           земли. Тень поверх неё лишь мылит края и читается как расфокус. */
        color: #e8eef4;
        font: 400 15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
        text-align: center;
        /* Ни flex, ни balance здесь нельзя.
           Flex сделал бы из набранной части и хвоста два отдельных блока в ряд:
           перенос по словам сломался бы, и они ездили бы друг относительно
           друга на каждой букве. Balance переделивает строки по-своему у каждой
           фразы, и на их смене текст скакал бы.
           Высота под самую длинную реплику ставится замером при показе. */
        min-height: 1.55em;
      }
      /* Ненабранный хвост держит место, но не виден: от этого строка стоит
         неподвижно, а буквы не расталкивают уже написанное. */
      .radiotext__rest { color: transparent; }

      /* Патроны вверху по центру. Потраченные не исчезают, а гаснут:
         так видно и сколько осталось, и сколько магазин вмещает. */
      /* Ряд обязан влезать в экран целиком. Десять патронов по 36 пикселей с
         зазорами — это 396, шире телефона, и крайние гильзы срезало краем.
         Предел по ширине даёт флексу право их сжать. */
      .ammo {
        position: fixed; left: 50%; transform: translateX(-50%);
        top: calc(34px + env(safe-area-inset-top));
        max-width: calc(100vw - 24px);
        z-index: 25; pointer-events: none;
        display: flex; gap: 4px;
      }
      .ammo__round {
        width: 36px; height: auto; min-width: 0;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        opacity: 1;
        transition: opacity 180ms ease;
      }
      .ammo__round--spent { opacity: 0.22; }
      /* display: flex сильнее атрибута hidden — без этой строки ряд патронов
         остаётся на экране, сколько его ни прячь. Та же ловушка, что у заставки.
         Прячем его, пока герой безоружен: считать ему нечего. */
      .ammo[hidden] { display: none; }

      /* Мгла лежит поверх кадра, но под всем, чем игрок пользуется. */
      .fog { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* --- экранный джойстик --- */
      .joystick__zone {
        position: fixed;
        inset: 0;
        z-index: 20;
        touch-action: none;
      }
      .joystick {
        position: fixed;
        z-index: 10;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 42%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 55%, rgba(0,0,0,0.12) 100%);
        border: 1px solid rgba(255,255,255,0.30);
        box-shadow:
          inset 0 6px 14px rgba(0,0,0,0.35),
          inset 0 -3px 8px rgba(255,255,255,0.12),
          0 2px 10px rgba(0,0,0,0.25);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
        transition: opacity 140ms ease;
        opacity: 0;
        visibility: hidden;
      }
      .joystick.is-active {
        opacity: 1;
        visibility: visible;
      }
      .joystick__knob {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 32%, #fdfdfd 0%, #dfe5ea 45%, #a9b3bd 78%, #7d8892 100%);
        box-shadow:
          0 6px 14px rgba(0,0,0,0.45),
          inset 0 -4px 8px rgba(0,0,0,0.22),
          inset 0 4px 8px rgba(255,255,255,0.75);
        will-change: transform;
      }

      /* --- панель разработчика --- */
      /* Панель разработчика сдвинута вниз: в самом углу теперь кнопка карты
         уровней, а она видна игроку и потому важнее. */
      .devpanel {
        position: fixed;
        right: calc(14px + env(safe-area-inset-right));
        top: calc(64px + env(safe-area-inset-top));
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .devpanel__button {
        font: inherit;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.35);
        background: rgba(20,26,32,0.72);
        color: #e8eef4;
        cursor: pointer;
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
      }
      .devpanel__button:hover { background: rgba(30,38,46,0.85); }
      .devpanel__button:disabled { opacity: 0.55; cursor: progress; }
      .devpanel__status {
        max-width: 320px;
        text-align: right;
        color: #9fb4c7;
        text-shadow: 0 1px 2px #000;
      }
      .devpanel__status[data-kind="ok"] { color: #8fd6a0; }
      .devpanel__status[data-kind="fail"] { color: #e59a9a; }
      .devpanel__status[data-kind="busy"] { color: #e8d08f; }

      .editor {
        position: fixed; left: 12px; bottom: 12px; z-index: 40;
        padding: 8px 12px; border-radius: 8px;
        background: rgba(20,26,32,0.78); border: 1px solid rgba(255,255,255,0.3);
        color: #e8eef4; white-space: pre;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        /* Панель мышь не ловит, чтобы не мешать правке сцены, — но кнопки в ней
           ловят: иначе по ним было бы не щёлкнуть. */
        pointer-events: none;
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
      }
      .editor__levels {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 6px; font-weight: 600;
      }
      .editor__arrow {
        pointer-events: auto;
        width: 26px; height: 24px;
        border-radius: 6px; border: 1px solid rgba(255,255,255,0.35);
        background: rgba(255,255,255,0.08); color: #e8eef4;
        font: 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: pointer;
      }
      .editor__arrow:hover { background: rgba(255,255,255,0.2); }

      .editor__toggles {
        display: flex; flex-direction: column; gap: 4px;
        margin: 8px 0 6px;
      }
      .editor__toggle {
        pointer-events: auto;
        display: flex; align-items: center; gap: 2px;
        color: #e8eef4; cursor: pointer;
      }
      .editor__toggle input { cursor: pointer; }

      /* Сноска о пропуске речи: мелкая строка прямо над плашкой субтитров.

         Живёт она внутри самого блока субтитров, а не сама по себе на экране.
         Поставленная отдельно, она налезала на плашку: та прижата к низу, но
         высота у неё своя на каждом экране — под длинную реплику резервируется
         несколько строк, — и угадать место над ней снаружи нельзя.

         Нажатий не ловит: пропуск ловят сама речь и её обработчики, а эта
         строка только сообщает о нём. */
      .skip {
        margin: 0 0 6px;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .skip[hidden] { display: none; }
      .skip--on { opacity: 1; }

      /* Подложка только под самими буквами, а не во всю ширину плашки: широкая
         полоса читалась бы как вторая строка речи. И она обязательна — под
         сноской идёт сцена, и на светлой стене или на песке серые буквы без неё
         пропадали совсем. */
      .skip__label {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(7, 9, 10, 0.55);
        color: rgba(232, 238, 244, 0.62);
        font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em; text-transform: uppercase;
      }

      /* Кнопка карты уровней: уголок вверху справа. */
      .mapbutton {
        position: fixed; z-index: 55;
        right: calc(14px + env(safe-area-inset-right));
        top: calc(12px + env(safe-area-inset-top));
        display: flex; flex-direction: column; justify-content: center; gap: 4px;
        width: 42px; height: 42px; padding: 0 11px;
        border-radius: 12px;
        border: 1px solid rgba(232, 208, 143, 0.35);
        background: rgba(7, 9, 10, 0.72);
        -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 160ms ease, transform 120ms ease;
      }
      .mapbutton[hidden] { display: none; }
      .mapbutton:hover { background: rgba(20, 24, 26, 0.85); }
      .mapbutton:active { transform: scale(0.94); }

      /* Три полоски — тот же список сверху вниз, что и на самой карте.
         Средняя короче: так значок читается как перечень, а не как решётка. */
      .mapbutton__line {
        height: 2px; border-radius: 2px;
        background: #e8d08f;
      }
      .mapbutton__line:nth-child(2) { width: 70%; }

      /* Карта уровней: шторка поверх игры со столбцом карточек. */
      .levelmap {
        position: fixed; inset: 0; z-index: 85;
        display: flex; align-items: flex-start; justify-content: center;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
        background: rgba(7, 9, 10, 0.86);
        -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
        opacity: 0;
        transition: opacity 280ms ease;
      }
      .levelmap[hidden] { display: none; }
      .levelmap--on { opacity: 1; }

      .levelmap__sheet {
        display: flex; flex-direction: column;
        width: min(520px, 100%);
        max-height: 100%;
        /* Заголовок стоит, список едет: иначе на телефоне уезжает и он. */
        overflow: hidden;
      }

      .levelmap__head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 4px 12px;
      }
      .levelmap__title {
        margin: 0;
        color: #e8d08f;
        font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; text-transform: uppercase;
      }
      .levelmap__close {
        width: 34px; height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(232, 208, 143, 0.3);
        background: transparent;
        color: rgba(232, 238, 244, 0.7);
        font: 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 160ms ease;
      }
      .levelmap__close:hover { background: rgba(232, 208, 143, 0.12); }

      .levelmap__list {
        display: flex; flex-direction: column; gap: 10px;
        overflow-y: auto;
        /* Страница целиком прибита к экрану и жесты на ней погашены — список
           свою прокрутку разрешает отдельно, иначе пальцем его не сдвинуть. */
        touch-action: pan-y;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding: 2px;
      }

      .levelmap__card {
        display: flex; align-items: center; gap: 14px;
        padding: 10px 14px 10px 10px;
        border-radius: 14px;
        border: 1px solid rgba(232, 208, 143, 0.18);
        background: rgba(18, 20, 22, 0.9);
        color: #e8eef4;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 160ms ease, border-color 160ms ease, transform 120ms ease;
      }
      .levelmap__card:hover { background: rgba(28, 31, 34, 0.95); border-color: rgba(232, 208, 143, 0.4); }
      .levelmap__card:active { transform: scale(0.99); }

      /* Тот, на котором игрок сейчас: подсвечен рамкой, чтобы не терять место. */
      .levelmap__card[data-here] {
        border-color: rgba(232, 208, 143, 0.65);
        background: rgba(34, 30, 22, 0.95);
      }

      /* Заставка уровня: по картинке его и узнают, название читают вторым. */
      .levelmap__shot {
        flex: none;
        width: 92px; height: 58px;
        border-radius: 9px;
        background: #07090a center/cover no-repeat;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .levelmap__text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .levelmap__number {
        color: rgba(232, 208, 143, 0.75);
        font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em; text-transform: uppercase;
      }
      .levelmap__name {
        color: #e8eef4;
        font: 15px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace;
        /* Длинное название не должно распирать карточку. */
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      .levelmap__here {
        margin-left: auto; flex: none;
        padding: 4px 9px;
        border-radius: 99px;
        background: rgba(232, 208, 143, 0.16);
        color: #e8d08f;
        font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em; text-transform: uppercase;
      }

      @media (max-width: 420px) {
        .levelmap__shot { width: 74px; height: 48px; }
        .levelmap__name { font-size: 14px; }
      }

      /* Экран смерти: тёмная пелена и кнопка «начать заново».

         Не глухая заливка, а полупрозрачная: сквозь неё видно место, где всё
         кончилось, — это одна неудачная попытка, а не выход из игры. */
      .death {
        position: fixed; inset: 0; z-index: 80;
        display: flex; align-items: center; justify-content: center;
        padding: 0 16px;
        background: radial-gradient(circle at 50% 45%, rgba(7, 9, 10, 0.55), rgba(7, 9, 10, 0.88));
        opacity: 0;
        transition: opacity 450ms ease;
      }
      .death[hidden] { display: none; }
      .death--on { opacity: 1; }

      .death__card {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        text-align: center;
      }

      /* Карточка чуть подаётся вверх на появлении: неподвижная читается как
         картинка, подъехавшая — как то, что сейчас произошло.

         Именно разовой анимацией, а не переходом между состояниями. С переходом
         смещение снималось вместе с классом, и на нажатии «начать заново» весь
         экран уезжал вниз, пока таял. Анимация же играет только на появлении, а
         в покое карточка стоит там, где ей и место. */
      @keyframes death-rise {
        from { transform: translateY(10px); }
        to   { transform: translateY(0); }
      }
      .death--on .death__card { animation: death-rise 450ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }

      .death__title {
        margin: 0;
        color: #e8d08f;
        font: 600 26px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; text-transform: uppercase;
      }
      .death__note {
        margin: 0 0 6px;
        color: rgba(232, 238, 244, 0.55);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Две кнопки столбиком: та, что нажимают почти всегда, — первой. */
      .death__buttons {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
      }

      /* Кнопка та же, что и на воротах: одна игра — один язык кнопок.
         Значок и надпись в строку, значок первым. */
      .death__again {
        display: flex; align-items: center; gap: 11px;
        font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: #e8d08f;
        padding: 14px 34px 14px 26px;
        border-radius: 99px;
        border: 1px solid rgba(232, 208, 143, 0.5);
        background: rgba(232, 208, 143, 0.06);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 160ms ease, transform 120ms ease;
      }
      .death__again:hover { background: rgba(232, 208, 143, 0.14); }
      .death__again:active { transform: scale(0.96); }

      /* Значок «играть»: квадрат с треугольником внутри. Цвет берёт у кнопки,
         поэтому подсветка при наведении красит его заодно с надписью. */
      .death__icon {
        flex: none;
        width: 20px; height: 20px;
        /* Прописные буквы стоят выше своей середины — значок опускаем на волос,
           иначе он кажется приподнятым над строкой. */
        margin-top: 1px;
      }

      /* «С начала» намеренно тише: попасть по ней случайно, метя в соседнюю,
         значит потерять всё пройденное. Ни рамки, ни заливки — только текст. */
      .death__start {
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: rgba(232, 238, 244, 0.42);
        padding: 10px 18px;
        border: 0; background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: color 160ms ease;
      }
      .death__start:hover { color: rgba(232, 238, 244, 0.75); }

      @media (prefers-reduced-motion: reduce) {
        .death--on .death__card { animation: none; }
      }

      /* Подсказка по управлению: карточка внизу экрана, один раз за сеанс.

         Лежит она над игрой, но нажатий не ловит: pointer-events отключены на
         всём, что в ней есть. Первое касание должно уходить в игру — стик под
         ней, и подсказка гаснет ровно от того же движения, которым игрок
         трогается с места. */
      .hint {
        position: fixed; inset: auto 0 0 0; z-index: 70;
        display: flex; justify-content: center;
        padding: 0 16px 8vh;
        pointer-events: none;
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 600ms ease, transform 600ms cubic-bezier(0.2, 0.7, 0.3, 1);
      }
      .hint[hidden] { display: none; }
      .hint--on { opacity: 1; transform: translateY(0); }

      .hint__card {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 18px 26px 14px;
        border-radius: 16px;
        border: 1px solid rgba(232, 208, 143, 0.22);
        /* Подложка тёмная и размытая: под ней идёт бой, и текст поверх него
           иначе не читается. */
        background: rgba(7, 9, 10, 0.72);
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      .hint__keys { display: flex; flex-direction: column; align-items: center; gap: 5px; }
      .hint__keys[hidden], .hint__stick[hidden] { display: none; }
      .hint__row { display: flex; gap: 5px; }

      .hint__key {
        display: flex; align-items: center; justify-content: center;
        width: 38px; height: 38px;
        border-radius: 8px;
        border: 1px solid rgba(232, 208, 143, 0.45);
        /* Клавиша светится изнутри и отбрасывает короткую тень вниз — так она
           читается как выпуклая, а не как нарисованный квадрат. */
        background: linear-gradient(180deg, rgba(232, 208, 143, 0.16), rgba(232, 208, 143, 0.05));
        box-shadow: 0 2px 0 rgba(232, 208, 143, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        color: #e8d08f;
        font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Клавиши загораются по очереди — W, A, S, D, — и по ним видно, что это
         не картинка, а то, что надо нажать. */
      @keyframes hint-press {
        0%, 62%, 100% { transform: translateY(0); box-shadow: 0 2px 0 rgba(232, 208, 143, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12); }
        70% { transform: translateY(2px); box-shadow: 0 0 0 rgba(232, 208, 143, 0), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
      }
      .hint__key { animation: hint-press 3200ms ease-in-out infinite; }
      .hint__row:last-child .hint__key:nth-child(1) { animation-delay: 800ms; }
      .hint__row:last-child .hint__key:nth-child(2) { animation-delay: 1600ms; }
      .hint__row:last-child .hint__key:nth-child(3) { animation-delay: 2400ms; }

      /* Стик: круг с ручкой, которая ходит по кругу — как палец по экрану. */
      .hint__stick { display: flex; justify-content: center; }
      .hint__base {
        position: relative;
        width: 66px; height: 66px;
        border-radius: 50%;
        border: 1px solid rgba(232, 208, 143, 0.35);
        background: radial-gradient(circle at 50% 50%, rgba(232, 208, 143, 0.1), rgba(232, 208, 143, 0.02));
      }
      .hint__knob {
        position: absolute; left: 50%; top: 50%;
        width: 26px; height: 26px; margin: -13px 0 0 -13px;
        border-radius: 50%;
        border: 1px solid rgba(232, 208, 143, 0.5);
        background: rgba(232, 208, 143, 0.22);
        box-shadow: 0 0 12px rgba(232, 208, 143, 0.25);
        animation: hint-knob 3600ms ease-in-out infinite;
      }
      @keyframes hint-knob {
        0%   { transform: translate(0, 0); }
        20%  { transform: translate(0, -15px); }
        45%  { transform: translate(14px, 6px); }
        70%  { transform: translate(-14px, 6px); }
        100% { transform: translate(0, 0); }
      }

      .hint__title {
        margin: 2px 0 0;
        color: #e8d08f;
        font: 600 15px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em; text-transform: uppercase;
      }
      .hint__note {
        margin: 0;
        color: rgba(232, 238, 244, 0.72);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .hint__tail {
        margin: 2px 0 0;
        color: rgba(232, 238, 244, 0.38);
        font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
      }

      @media (prefers-reduced-motion: reduce) {
        .hint__key, .hint__knob { animation: none; }
        .hint { transition: opacity 600ms ease; transform: none; }
      }

      /* Ворота: чёрный экран с одной кнопкой, с которого всё начинается.
         Лежат поверх экрана загрузки: тот уже показывает свои реплики под ними,
         но увидеть его игрок должен только после нажатия. */
      .gate {
        position: fixed; inset: 0; z-index: 95;
        display: flex; align-items: center; justify-content: center;background: rgb(0, 0, 0);
      }
      .gate[hidden] { display: none; }

      .gate__play {
        font: 600 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.16em; text-transform: uppercase;
        color: #e8d08f;
        padding: 17px 46px;
        border-radius: 99px;
        border: 1px solid rgba(232, 208, 143, 0.5);
        background: rgba(232, 208, 143, 0.06);
        cursor: pointer;
        /* Серую вспышку по тапу гасим: на чёрном экране она читается как сбой. */
        -webkit-tap-highlight-color: transparent;
        transition: background 160ms ease, transform 120ms ease;
      }
      .gate__play:hover { background: rgba(232, 208, 143, 0.14); }
      .gate__play:active { transform: scale(0.96); }

      /* Мягкое дыхание: на пустом чёрном экране неподвижная кнопка читается как
         картинка, а не как то, на что надо нажать. */
      @keyframes gate-breath {
        from { box-shadow: 0 0 0 0 rgba(232, 208, 143, 0.28); }
        to   { box-shadow: 0 0 0 14px rgba(232, 208, 143, 0); }
      }
      .gate__play { animation: gate-breath 2200ms ease-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .gate__play { animation: none; }
      }

      /* Загрузка самой игры: голый чёрный экран, реплика и полоса под ней.
         Ни картинок, ни рамок — до заставки уровня показывать ещё нечего. */
      .boot {
        position: fixed; inset: 0; z-index: 90;
        display: flex; align-items: center; justify-content: center;
        background: #000000;
      }
      .boot[hidden] { display: none; }

      /* Реплика вынута из потока и подвешена над полосой.
         Иначе полоса ехала бы за ней: реплики разной длины, одна встаёт в
         строку, другая в две — и на каждой смене полоса прыгала бы вниз-вверх.
         Так она стоит ровно по центру экрана, сколько бы строк ни занял текст. */
      .boot__line {
        position: absolute;
        left: 50%; transform: translateX(-50%);
        bottom: calc(50% + 22px);
        width: min(78vw, 560px);
        text-align: center; text-wrap: balance;
        color: #cbd6e2; text-shadow: 0 2px 6px #000;
        font: 400 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.03em;
        opacity: 0;
        transition: opacity 320ms ease;
      }
      .boot__bar {
        width: min(46vw, 340px); height: 8px;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255,255,255,0.28);
        overflow: hidden;
      }
      .boot__fill {
        height: 100%; width: 0;
        background: #e8d08f;
        transition: width 160ms linear;
      }

      /* Финальный экран: кроет всё, включая заставку, и не отдаёт управление. */
      .ending {
        position: fixed; inset: 0; z-index: 80;
        background: #000000 center / cover no-repeat;
        opacity: 0; pointer-events: none;
        transition: opacity 900ms ease;
      }
      /* Песок поверх картинки: он часть кадра, поэтому дышит вместе с ним. */
      .ending__dust {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
      }

      .ending--on {
        opacity: 1; pointer-events: auto;
        animation: ending-breath 11s ease-in-out infinite alternate;
      }

      /* Медленное дыхание кадра: картинка неподвижна ровно настолько, чтобы
         казаться живой, а не зациклённой. Масштаб только вверх от единицы —
         иначе из-под кадра полезли бы края. */
      @keyframes ending-breath {
        from { transform: scale(1); }
        to   { transform: scale(1.07); }
      }

      @media (prefers-reduced-motion: reduce) {
        .ending--on { animation: none; }
      }

      .splash {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        background: #000000;
      }
      /* display: flex сильнее атрибута hidden, и без этой строки заставка
         остаётся висеть поверх игры, сколько её ни прячь. */
      .splash[hidden] { display: none; }
      /* Картинка кроет экран целиком при любом соотношении сторон: лишнее
         обрезается, пустых полей не остаётся. */
      .splash__image {
        position: absolute; inset: 0;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
      /* Подпись подвешена над полосой ровно так же, как реплика на загрузке
         игры: у обоих экранов полоса стоит по центру и никуда не едет, сколько
         бы строк ни занял текст. Иначе на переходе от одной загрузки к другой
         полоса прыгает — а идут они подряд, и прыжок этот хорошо виден. */
      .splash__caption {
        position: absolute;
        left: 50%; transform: translateX(-50%);
        bottom: calc(50% + 22px);
        width: min(78vw, 560px);
        text-align: center; text-wrap: balance;
        color: #e8eef4; text-shadow: 0 2px 6px #000;
        font: 600 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
      }
      .splash__bar {
        position: relative;
        width: min(46vw, 340px); height: 8px;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255,255,255,0.35);
        overflow: hidden;
      }
      .splash__fill {
        height: 100%; width: 0;
        background: #e8d08f;
        transition: width 120ms linear;
      }

      /* Рация: видна, пока по ней говорят. Появляется и уходит прозрачностью,
         а не показом — резкое включение в углу читается как сбой, а не как
         вызов на связь. */
      .radio {
        position: fixed; z-index: 50;
        left: calc(16px + env(safe-area-inset-left));
        bottom: calc(16px + env(safe-area-inset-bottom));
        width: min(32vh, 230px); aspect-ratio: 1;
        opacity: 0; pointer-events: none;
        transition: opacity 450ms ease;
      }
      .radio--on { opacity: 1; }

      /* Сама рация покачивается, чтобы не выглядеть наклейкой на стекле. Круги
         качаться не должны — они идут от антенны и стоят на месте, поэтому
         движение висит на картинке, а не на всей коробке. */
      .radio__set {
        position: relative; z-index: 1;
        width: 100%; height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.55));
        transform-origin: 50% 90%;
      }
      .radio--on .radio__set { animation: radio-bounce 820ms ease-in-out infinite alternate; }

      @keyframes radio-bounce {
        from { transform: translateY(0) rotate(-2deg); }
        to   { transform: translateY(-9px) rotate(2deg); }
      }

      /* Круги сигнала: расходятся от рации и тают. Три штуки вразнобой — одна
         волна читается как разовая вспышка, а не как идущая передача. */
      .radio__wave {
        position: absolute; left: 50%; top: 52%;
        width: 62%; aspect-ratio: 1;
        margin: -31% 0 0 -31%;
        border: 2px solid rgba(232, 208, 143, 0.75);
        border-radius: 50%;
        opacity: 0;
      }
      .radio--on .radio__wave { animation: radio-wave 2200ms ease-out infinite; }
      .radio--on .radio__wave:nth-child(2) { animation-delay: 730ms; }
      .radio--on .radio__wave:nth-child(3) { animation-delay: 1460ms; }

      @keyframes radio-wave {
        from { transform: scale(0.35); opacity: 0.85; }
        to   { transform: scale(1.6);  opacity: 0; }
      }

      /* Кому движение мешает — рация просто висит на месте, без кругов. */
      @media (prefers-reduced-motion: reduce) {
        .radio--on .radio__set,
        .radio--on .radio__wave { animation: none; }
      }

      /* Счётчик кадров: правый верхний угол, мимо патронов и кнопки. */
      /* Вниз, а не вверх: наверху и без него тесно — там имя уровня, патроны
         и кнопка панели, и счётчик ложился прямо на гильзы. */
      .stats {
        position: fixed; z-index: 26;
        right: calc(12px + env(safe-area-inset-right));
        bottom: calc(12px + env(safe-area-inset-bottom));
        pointer-events: none;
        font: 400 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fe6b0; text-shadow: 0 1px 3px #000;
        white-space: pre;
      }

      #hud {
        position: fixed; z-index: 25;
        left: calc(12px + env(safe-area-inset-left));
        top: calc(10px + env(safe-area-inset-top));
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fb4c7; text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      /* «Вышла новая версия»: строка вверху по центру и кнопка.

         Вверху, а не внизу: внизу занято всё — слева рация, по центру субтитры,
         справа счётчик кадров, и поверх этого палец возит стик. */
      .update {
        position: fixed; z-index: 55;
        left: 50%; transform: translateX(-50%);
        top: calc(104px + env(safe-area-inset-top));
        display: flex; align-items: center; gap: 12px;
        padding: 8px 10px 8px 16px;
        border-radius: 99px;
        background: rgba(7, 9, 10, 0.92);
        border: 1px solid rgba(232, 208, 143, 0.35);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        max-width: calc(100vw - 20px);
      }
      .update[hidden] { display: none; }

      .update__text {
        color: #e8eef4; text-shadow: 0 1px 3px #000;
        font: 400 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .update__button {
        flex: none;
        font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: #07090a; background: #e8d08f;
        padding: 9px 16px;
        border: 0; border-radius: 99px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .update__button:hover { background: #f2dda6; }
      .update__button:disabled { opacity: 0.6; cursor: progress; }

      /* --- телефон ---

         На широком экране интерфейс расходится сам собой, на телефоне — нет.
         Наверху одну полосу делят имя уровня, ряд патронов и кнопка панели;
         внизу — рация и субтитры. Без правил ниже они наезжают друг на друга, а
         рация вдобавок нарисована выше субтитров и просто съедала текст — ровно
         тогда, когда его и надо читать, потому что показывают её на вступлении.

         Разводим так: патроны мельче и ниже кнопки, рация заметно меньше, а
         субтитры подняты выше её макушки. Пересечься они после этого не могут
         ни при каком размере экрана. */

      /* Узкий экран: телефон в портрете */
      @media (max-width: 560px) {
        .ammo { top: calc(46px + env(safe-area-inset-top)); }
        .ammo__round { width: 22px; }

        .radio { width: min(16vh, 84px); }

        .radiotext {
          bottom: calc(112px + env(safe-area-inset-bottom));
          width: min(90vw, 560px);
        }
        .radiotext__line { font-size: 13px; padding: 8px 12px; }

        .devpanel__status { max-width: min(320px, 52vw); }

        /* Под рядом патронов: на узком экране он опущен ниже. */
        .update { top: calc(78px + env(safe-area-inset-top)); gap: 8px; padding: 7px 7px 7px 14px; }
        .update__text { font-size: 12px; }
        .update__button { padding: 8px 13px; font-size: 12px; }

      }

      /* Низкий экран: телефон в ландшафте. Места по высоте мало, поэтому текст
         прижимается к самому низу, а вширь не пускается дальше рации. */
      @media (max-height: 460px) {
        .ammo { top: calc(30px + env(safe-area-inset-top)); }
        .ammo__round { width: 20px; }

        .radio { width: min(20vh, 84px); }

        .radiotext {
          bottom: calc(52px + env(safe-area-inset-bottom));
          width: min(70vw, 520px);
        }
        .radiotext__line { font-size: 13px; padding: 7px 12px; }

        /* Высоты мало: строка идёт сразу под патронами, которые тут выше. */
        .update { top: calc(58px + env(safe-area-inset-top)); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Подпись уровня. Скрыта до тех пор, пока уровень не собран: показывать
         её раньше нечего, а на экране с кнопкой она просвечивала насквозь и
         мозолила глаза словом «загрузка» поверх пустоты. Показывает её сама
         игра, когда ей действительно есть что написать. -->
    <div id="hud" hidden>загрузка…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
