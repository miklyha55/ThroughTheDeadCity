<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Through The Dead City</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; touch-action: none; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* --- экранный джойстик --- */
      .joystick__zone {
        position: fixed;
        inset: 0;
        z-index: 20;
        touch-action: none;
      }
      .joystick {
        position: fixed;
        z-index: 10;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 42%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 55%, rgba(0,0,0,0.12) 100%);
        border: 1px solid rgba(255,255,255,0.30);
        box-shadow:
          inset 0 6px 14px rgba(0,0,0,0.35),
          inset 0 -3px 8px rgba(255,255,255,0.12),
          0 2px 10px rgba(0,0,0,0.25);
        backdrop-filter: blur(2px);
        transition: opacity 140ms ease;
        opacity: 0;
        visibility: hidden;
      }
      .joystick.is-active {
        opacity: 1;
        visibility: visible;
      }
      .joystick__knob {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 32%, #fdfdfd 0%, #dfe5ea 45%, #a9b3bd 78%, #7d8892 100%);
        box-shadow:
          0 6px 14px rgba(0,0,0,0.45),
          inset 0 -4px 8px rgba(0,0,0,0.22),
          inset 0 4px 8px rgba(255,255,255,0.75);
        will-change: transform;
      }

      /* --- панель разработчика --- */
      .devpanel {
        position: fixed;
        right: 14px;
        top: 12px;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .devpanel__button {
        font: inherit;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.35);
        background: rgba(20,26,32,0.72);
        color: #e8eef4;
        cursor: pointer;
        backdrop-filter: blur(3px);
      }
      .devpanel__button:hover { background: rgba(30,38,46,0.85); }
      .devpanel__button:disabled { opacity: 0.55; cursor: progress; }
      .devpanel__status {
        max-width: 320px;
        text-align: right;
        color: #9fb4c7;
        text-shadow: 0 1px 2px #000;
      }
      .devpanel__status[data-kind="ok"] { color: #8fd6a0; }
      .devpanel__status[data-kind="fail"] { color: #e59a9a; }
      .devpanel__status[data-kind="busy"] { color: #e8d08f; }

      .editor {
        position: fixed; left: 12px; bottom: 12px; z-index: 40;
        padding: 8px 12px; border-radius: 8px;
        background: rgba(20,26,32,0.78); border: 1px solid rgba(255,255,255,0.3);
        color: #e8eef4; white-space: pre;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        /* Панель мышь не ловит, чтобы не мешать правке сцены, — но кнопки в ней
           ловят: иначе по ним было бы не щёлкнуть. */
        pointer-events: none; backdrop-filter: blur(3px);
      }
      .editor__levels {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 6px; font-weight: 600;
      }
      .editor__arrow {
        pointer-events: auto;
        width: 26px; height: 24px;
        border-radius: 6px; border: 1px solid rgba(255,255,255,0.35);
        background: rgba(255,255,255,0.08); color: #e8eef4;
        font: 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: pointer;
      }
      .editor__arrow:hover { background: rgba(255,255,255,0.2); }

      .editor__toggles {
        display: flex; flex-direction: column; gap: 4px;
        margin: 8px 0 6px;
      }
      .editor__toggle {
        pointer-events: auto;
        display: flex; align-items: center; gap: 2px;
        color: #e8eef4; cursor: pointer;
      }
      .editor__toggle input { cursor: pointer; }

      /* Загрузка самой игры: голый чёрный экран, реплика и полоса под ней.
         Ни картинок, ни рамок — до заставки уровня показывать ещё нечего. */
      .boot {
        position: fixed; inset: 0; z-index: 90;
        display: flex; align-items: center; justify-content: center;
        background: #05070a;
      }
      .boot[hidden] { display: none; }

      /* Реплика вынута из потока и подвешена над полосой.
         Иначе полоса ехала бы за ней: реплики разной длины, одна встаёт в
         строку, другая в две — и на каждой смене полоса прыгала бы вниз-вверх.
         Так она стоит ровно по центру экрана, сколько бы строк ни занял текст. */
      .boot__line {
        position: absolute;
        left: 50%; transform: translateX(-50%);
        bottom: calc(50% + 22px);
        width: min(78vw, 560px);
        text-align: center; text-wrap: balance;
        color: #cbd6e2; text-shadow: 0 2px 6px #000;
        font: 400 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.03em;
        opacity: 0;
        transition: opacity 320ms ease;
      }
      .boot__bar {
        width: min(46vw, 340px); height: 8px;
        border-radius: 99px;
        background: rgba(10,14,18,0.7);
        border: 1px solid rgba(255,255,255,0.28);
        overflow: hidden;
      }
      .boot__fill {
        height: 100%; width: 0;
        background: #e8d08f;
        transition: width 160ms linear;
      }

      /* Финальный экран: кроет всё, включая заставку, и не отдаёт управление. */
      .ending {
        position: fixed; inset: 0; z-index: 80;
        background: #0b0e12 center / cover no-repeat;
        opacity: 0; pointer-events: none;
        transition: opacity 900ms ease;
      }
      .ending--on {
        opacity: 1; pointer-events: auto;
        animation: ending-breath 11s ease-in-out infinite alternate;
      }

      /* Медленное дыхание кадра: картинка неподвижна ровно настолько, чтобы
         казаться живой, а не зациклённой. Масштаб только вверх от единицы —
         иначе из-под кадра полезли бы края. */
      @keyframes ending-breath {
        from { transform: scale(1); }
        to   { transform: scale(1.07); }
      }

      @media (prefers-reduced-motion: reduce) {
        .ending--on { animation: none; }
      }

      .splash {
        position: fixed; inset: 0; z-index: 60;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #0b0e12;
      }
      /* display: flex сильнее атрибута hidden, и без этой строки заставка
         остаётся висеть поверх игры, сколько её ни прячь. */
      .splash[hidden] { display: none; }
      /* Картинка кроет экран целиком при любом соотношении сторон: лишнее
         обрезается, пустых полей не остаётся. */
      .splash__image {
        position: absolute; inset: 0;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
      .splash__caption {
        position: relative;
        color: #e8eef4; text-shadow: 0 2px 6px #000;
        font: 600 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
      }
      .splash__bar {
        position: relative;
        width: min(46vw, 340px); height: 8px;
        border-radius: 99px;
        background: rgba(10,14,18,0.7);
        border: 1px solid rgba(255,255,255,0.35);
        overflow: hidden;
      }
      .splash__fill {
        height: 100%; width: 0;
        background: #e8d08f;
        transition: width 120ms linear;
      }

      /* Рация: видна, пока по ней говорят. Появляется и уходит прозрачностью,
         а не показом — резкое включение в углу читается как сбой, а не как
         вызов на связь. */
      .radio {
        position: fixed; left: 16px; bottom: 16px; z-index: 50;
        width: min(32vh, 230px); aspect-ratio: 1;
        opacity: 0; pointer-events: none;
        transition: opacity 450ms ease;
      }
      .radio--on { opacity: 1; }

      /* Сама рация покачивается, чтобы не выглядеть наклейкой на стекле. Круги
         качаться не должны — они идут от антенны и стоят на месте, поэтому
         движение висит на картинке, а не на всей коробке. */
      .radio__set {
        position: relative; z-index: 1;
        width: 100%; height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55));
        transform-origin: 50% 90%;
      }
      .radio--on .radio__set { animation: radio-bounce 820ms ease-in-out infinite alternate; }

      @keyframes radio-bounce {
        from { transform: translateY(0) rotate(-2deg); }
        to   { transform: translateY(-9px) rotate(2deg); }
      }

      /* Круги сигнала: расходятся от рации и тают. Три штуки вразнобой — одна
         волна читается как разовая вспышка, а не как идущая передача. */
      .radio__wave {
        position: absolute; left: 50%; top: 52%;
        width: 62%; aspect-ratio: 1;
        margin: -31% 0 0 -31%;
        border: 2px solid rgba(232, 208, 143, 0.75);
        border-radius: 50%;
        opacity: 0;
      }
      .radio--on .radio__wave { animation: radio-wave 2200ms ease-out infinite; }
      .radio--on .radio__wave:nth-child(2) { animation-delay: 730ms; }
      .radio--on .radio__wave:nth-child(3) { animation-delay: 1460ms; }

      @keyframes radio-wave {
        from { transform: scale(0.35); opacity: 0.85; }
        to   { transform: scale(1.6);  opacity: 0; }
      }

      /* Кому движение мешает — рация просто висит на месте, без кругов. */
      @media (prefers-reduced-motion: reduce) {
        .radio--on .radio__set,
        .radio--on .radio__wave { animation: none; }
      }

      #hud {
        position: fixed; left: 12px; top: 10px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fb4c7; text-shadow: 0 1px 2px #000; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">загрузка…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
